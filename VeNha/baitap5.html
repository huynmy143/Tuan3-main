<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bố cục trang web</title>
    <style>
        /* 1. Khung bao bọc ngoài cùng (wrapper) */
        #wrapper {
            width: 520px;
            margin: 30px auto;
            border: 2px solid black;
            padding: 10px;
        }

        /* 2. Phần Header */
        header {
            height: 60px;
            border: 2px solid black;
            margin-bottom: 10px;
            padding: 5px;
        }

        /* 3. Cột Nav (trái) */
        nav {
            float: left;
            width: 80px;
            height: 250px;
            border: 2px solid black;
            padding: 5px;
        }

        /* 4. Cột Main (phải) */
        main {
            float: right;
            width: 410px;
            height: 250px;
            border: 2px solid black;
            padding: 5px;
        }

        /* 5. Phần Footer */
        footer {
            clear: both;
            height: 40px;
            border: 2px solid black;
            margin-top: 10px;
            padding: 5px;
        }
    </style>
</head>
<body>

    <div id="wrapper">
        <header>header</header>
        <nav>nav</nav>
        <main>main</main>
        <footer>footer</footer>
    </div>

</body>
</html>
